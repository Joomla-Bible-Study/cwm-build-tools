name: Joomla Package CI (reusable)

# Reusable workflow for Joomla extension package CI.
#
# Inputs are passed via workflow_call. Untrusted user-supplied strings are
# never interpolated directly into run: blocks — values like build-command
# and package-glob are exposed to scripts via env: variables and quoted
# inside double quotes there.
#
# Consuming projects call this via:
#   jobs:
#     ci:
#       uses: Joomla-Bible-Study/cwm-build-tools/.github/workflows/joomla-package-ci.yml@v1
#       with:
#         php-version: '8.3'
#         node-version: '24'
#
# `v1` is a moving tag re-pointed at each release, so consumers pick up
# pipeline fixes without editing anything; only a breaking change to the input
# surface forces them to move to `@v2`. Pin to an exact tag (`@v1.9.1`) instead
# if a project needs a pipeline that cannot change under it.

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to use'
        required: false
        type: string
        default: '8.3'
      node-version:
        description: 'Node version to use'
        required: false
        type: string
        default: '24'
      submodules:
        description: 'Whether to checkout git submodules (true/false/recursive)'
        required: false
        type: string
        default: 'recursive'
      build-command:
        description: 'Composer script that builds the package zip'
        required: false
        type: string
        default: 'composer build'
      package-glob:
        description: 'Glob matching the produced package zip'
        required: false
        type: string
        default: 'build/dist/pkg_*.zip'
      run-tests:
        description: 'Whether to run composer test'
        required: false
        type: boolean
        default: true
      run-lint:
        description: 'Whether to run composer lint (PHP CS Fixer)'
        required: false
        type: boolean
        default: true
      run-lint-syntax:
        description: 'Whether to run composer lint:syntax (php -l). Separate from run-lint because a project can have one script and not the other, or style debt it has not paid down yet.'
        required: false
        type: boolean
        default: true
      php-extensions:
        description: 'Extensions for setup-php'
        required: false
        type: string
        default: 'mbstring, json, xml, zip, curl'
      lib-path:
        description: 'Optional path to a sub-library directory that needs npm build before packaging'
        required: false
        type: string
        default: ''

env:
  NODE_OPTIONS: --disable-warning=DEP0040

jobs:
  ci:
    name: PHP Lint, Tests, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.submodules }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            **/package-lock.json

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP syntax
        if: ${{ inputs.run-lint-syntax }}
        run: composer lint:syntax

      - name: Run PHP CS Fixer (dry-run)
        if: ${{ inputs.run-lint }}
        run: composer lint

      - name: Run PHPUnit
        if: ${{ inputs.run-tests }}
        run: composer test

      - name: Build sub-library (if configured)
        if: ${{ inputs.lib-path != '' }}
        env:
          LIB_PATH: ${{ inputs.lib-path }}
          # Sub-library builds may fetch prebuilt dependencies from the
          # releases API. Unauthenticated, that is 60 requests an hour shared
          # across every job on the runner's IP, which is exhausted often
          # enough to be a flaky-CI source rather than a hypothetical.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Produces the sub-library zip that the outer build consumes as a
        # prebuilt include. `composer build:package` is checked first because
        # the libraries have moved their packaging onto cwm-build and deleted
        # build/build-package.php; looking only for that file silently skipped
        # the step and left the outer build to fail on a missing include.
        run: |
          cd "$LIB_PATH"
          composer install --no-interaction --prefer-dist
          npm ci
          npm run build
          if composer run-script --list 2>/dev/null | grep -qE '^\s+build:package'; then
            composer build:package
          elif [ -f build/build-package.php ]; then
            php build/build-package.php
          else
            echo "No sub-library packaging step found in $LIB_PATH"
            echo "Expected a 'build:package' composer script or build/build-package.php."
            exit 1
          fi

      - name: Build package
        env:
          BUILD_CMD: ${{ inputs.build-command }}
          # See the sub-library step: a preBuild hook that pulls prebuilt
          # member zips from the releases API needs this to avoid the
          # unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash -c "$BUILD_CMD"

      - name: Verify package built
        env:
          PKG_GLOB: ${{ inputs.package-glob }}
        # The listing is for log visibility only — verification that the
        # expected inner entries are present belongs in the build itself, so
        # it fails fast rather than at the end of CI.
        run: |
          shopt -s nullglob
          ARTIFACTS=( $PKG_GLOB )
          shopt -u nullglob
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "No package found matching $PKG_GLOB"
            exit 1
          fi
          echo "Built: ${ARTIFACTS[*]}"
          for artifact in "${ARTIFACTS[@]}"; do
            echo "Contents of ${artifact}:"
            unzip -l "$artifact"
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ inputs.package-glob }}
          retention-days: 7
