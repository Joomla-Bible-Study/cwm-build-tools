name: Tests

# Runs this repository's own test suite.
#
# joomla-package-ci.yml is a reusable workflow for *consuming* projects and
# never runs here; docs.yml only builds the documentation site. So until this
# existed, nothing verified this repo on push or pull request, and every PR
# merged reporting "no checks reported" (see issue #46).
#
# That matters more here than in most repos: this package cuts the releases for
# every CWM project, and its failure mode is quiet. A regression in release.sh
# or ars-publish.sh does not throw — it publishes something wrong and reports
# success.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    services:
      # tests/Dev/TestSiteIntrospectionTest.php reads information_schema, which
      # the in-memory SQLite the rest of the suite uses does not have. Without a
      # real server those tests skip, and hasTable/hasColumn/hasIndex go back to
      # having no coverage while the suite still reports green -- so the test
      # fails rather than skips when CI is set and this service is missing.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cwm_build_tools_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the composer.json floor; 8.4 and 8.5 are what the maintainers
        # actually run, and a release that only works on one of them should
        # fail here rather than at a consumer.
        #
        # 8.5 is in the matrix because leaving it out made CI greener than
        # reality: the machine that cuts releases runs 8.5, so the version that
        # actually publishes was the one version nothing verified.
        #
        # It does not, on its own, catch the deprecation in #80. That fires in
        # StreamTransport, which the suite deliberately does not exercise —
        # ArsPublisher is tested through FakeTransport so publishing decisions
        # can be checked without the network. Catching #80 needs coverage of
        # StreamTransport as well as this matrix entry.
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, simplexml, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Set up Python
        # scripts/sync-languages.py is tested by tests/python. Runners ship a
        # Python, but pinning it keeps the Python half of `composer test` from
        # depending on whatever the image happens to provide.
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        # composer test runs PHPUnit and the Python suite.
        run: composer test
        env:
          CWM_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=cwm_build_tools_test'
          CWM_TEST_MYSQL_USER: root
          CWM_TEST_MYSQL_PASSWORD: root

  mariadb:
    # The same introspection tests against the other engine our users actually
    # run. One PHP version is enough: what is being checked is the server's
    # information_schema, not the language binding. Kept as its own job rather
    # than a matrix dimension because a service container cannot be selected
    # per-entry, and crossing three PHP versions with two engines would triple
    # the suite to cover a difference that lives entirely in the server.
    name: MariaDB introspection
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: cwm_build_tools_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, simplexml, zip, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run introspection tests
        run: vendor/bin/phpunit tests/Dev/TestSiteIntrospectionTest.php --testdox
        env:
          CWM_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3307;dbname=cwm_build_tools_test'
          CWM_TEST_MYSQL_USER: root
          CWM_TEST_MYSQL_PASSWORD: root

  lint:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, simplexml, zip
          coverage: none
          tools: composer:v2

      # Same cache the test job has had all along. Without it this job pulled
      # every dist archive from codeload on every run, which made it the only
      # job that could not survive GitHub rate-limiting them: during the
      # 2026-08-17 incident the three PHP jobs restored from cache and passed
      # while this one failed four times on HTTP 429, before running a single
      # check. The key matches the test job's 8.3 entry so either can warm it.
      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check syntax of every PHP file
        # Catches a parse error in scripts/, which has no unit coverage at all
        # (issue #32) and is otherwise only exercised by running a release.
        run: find src scripts tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: shellcheck every shell script
        # Preinstalled on ubuntu runners. Catches quoting, unset variables and
        # word-splitting — the class of shell bug bash -n cannot see. The
        # semantic bugs (#37, #38, #51) need the behavioural tests in
        # tests/shell for that; this covers the rest. See #52.
        run: shellcheck -S warning scripts/*.sh scripts/lib/*.sh

      - name: Run shell behavioural tests
        run: |
          rc=0
          for t in tests/shell/*.test.sh; do
            bash "$t" || rc=1
          done
          exit $rc

      - name: Check syntax of every shell script
        # release.sh and ars-publish.sh are the release pipeline; a syntax error
        # in either is discovered mid-release today.
        # `rc`, not `status`: the latter is read-only in zsh, and this loop is
        # the sort of thing someone pastes into a local shell to reproduce.
        run: |
          rc=0
          for f in scripts/*.sh; do
            bash -n "$f" || rc=1
          done
          exit $rc

      - name: Spellcheck
        # Docs, comments and templates. Named ignores: "unparseable" is a
        # legitimate variant spelling; "UPDATEing" is deliberate emphasis of
        # the SQL verb in a docblock; "titel" is the Dutch mistranslation the
        # sync-languages placeholder tests assert against — "fixing" that
        # fixture would defeat the test.
        run: |
          pip install codespell
          codespell --ignore-words-list unparseable,updateing,titel,hastable \
            README.md CHANGELOG.md docs/ templates/ scripts/ src/ tests/

      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py
