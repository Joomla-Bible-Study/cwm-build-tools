# Dependabot version updates.
#
# Security updates run without this file; version updates need it.
#
# Minor and patch bumps are grouped into a single PR per ecosystem. Major
# bumps stay separate, since those want reading.
version: 2

updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
